name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "LICENSE_STATUS.md"
      - "NOTICE"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.12"
          enable-cache: true

      - name: Run quality gate
        id: gate
        continue-on-error: true
        shell: bash
        run: |
          set +e
          failures=()

          run_gate() {
            local label="$1"
            shift
            echo "::group::${label}"
            "$@"
            local rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              failures+=("$label")
            fi
            return "$rc"
          }

          run_gate sync uv sync --frozen
          sync_rc=$?

          if [ "$sync_rc" -eq 0 ]; then
            run_gate format uv run ruff format --check .
            run_gate lint uv run ruff check .
            run_gate mypy uv run mypy src
            run_gate pytest uv run pytest
            run_gate imports uv run lint-imports
            run_gate build uv build
            run_gate whitespace git diff --check
          fi

          if printf '%s\n' "${failures[@]}" | grep -qx format; then
            echo "::group::format autofix diff"
            uv run ruff format --diff . || true
            echo "::endgroup::"
          fi

          if printf '%s\n' "${failures[@]}" | grep -qx lint; then
            echo "::group::lint autofix diff"
            uv run ruff check --diff . || true
            echo "::endgroup::"
          fi

          if [ "${#failures[@]}" -eq 0 ]; then
            echo "failures=" >> "$GITHUB_OUTPUT"
            echo "Quality gate passed."
            exit 0
          fi

          failure_csv=$(IFS=,; echo "${failures[*]}")
          echo "failures=${failure_csv}" >> "$GITHUB_OUTPUT"
          echo "Quality gate failed: ${failure_csv}"
          exit 1

      - name: Publish diagnostic commit status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          GATE_FAILURES: ${{ steps.gate.outputs.failures }}
        run: |
          if [ "$GATE_OUTCOME" = "success" ]; then
            state="success"
            description="all quality gates passed"
          else
            state="failure"
            description="failed: ${GATE_FAILURES:-workflow setup}"
          fi

          description="${description:0:140}"

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="ci/quality-gate-diagnostic" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Fail workflow when quality gate failed
        if: steps.gate.outcome != 'success'
        run: exit 1
