name: Dispatch RC Once

on:
  push:
    branches:
      - ops/rc-0.1.0-dispatch-once

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch final Human-Gate-fixed Windows release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run windows-release-candidate.yml
          --repo "$GITHUB_REPOSITORY"
          --ref main
          -f source_ref=80ab920b19c1ed1aebef4fa9b7eab05d6a509f38
