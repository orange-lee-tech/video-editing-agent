name: Windows Environment Doctor Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/probes/environment_doctor.trigger"

permissions:
  contents: read
  statuses: write

concurrency:
  group: environment-doctor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-doctor:
    name: Windows Environment Doctor
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked base environment
        run: uv sync --frozen

      - name: Install pinned FFmpeg 8.1
        shell: pwsh
        run: .\.github\scripts\install-ffmpeg-windows.ps1

      - name: Execute production Environment Doctor
        id: doctor_probe
        continue-on-error: true
        shell: pwsh
        run: |
          $before = git status --porcelain --untracked-files=all
          if ($before) { throw "Repository must be clean before Environment Doctor probe" }

          $sentinel = "DOCTOR-SENTINEL-" + [guid]::NewGuid().ToString("N")
          $env:DEEPSEEK_API_KEY = $sentinel
          $env:GEMINI_API_KEY = $sentinel
          $env:OPENAI_API_KEY = ""
          $env:DOCTOR_SENTINEL = $sentinel

          $report = Join-Path $env:RUNNER_TEMP "environment-doctor.json"
          $doctorOutput = uv run video-editing-agent doctor
          if ($LASTEXITCODE -ne 0) { throw "production Environment Doctor command failed" }
          $doctorOutput | Set-Content -Path $report -Encoding utf8

          uv run python .\tools\probes\r0_12_environment_doctor.py --report $report
          if ($LASTEXITCODE -ne 0) { throw "Environment Doctor evidence validation failed" }

          $after = git status --porcelain --untracked-files=all
          if ($after) { throw "Environment Doctor mutated repository/project state: $after" }

      - name: Publish Environment Doctor status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DOCTOR_OUTCOME: ${{ steps.doctor_probe.outcome }}
        run: |
          if [ "$DOCTOR_OUTCOME" = "success" ]; then
            state="success"
            description="Windows Environment Doctor probe passed"
          else
            state="failure"
            description="Windows Environment Doctor probe failed"
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="ci/environment-doctor-windows" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Fail workflow when Environment Doctor failed
        if: steps.doctor_probe.outcome != 'success'
        run: exit 1
