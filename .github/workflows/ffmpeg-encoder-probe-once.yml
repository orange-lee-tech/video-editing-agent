name: FFmpeg Encoder Probe Once

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-2025
    steps:
      - name: Probe exact bundled LGPL FFmpeg encoders
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-lgpl.zip"
          $root = Join-Path $env:RUNNER_TEMP "ffmpeg-lgpl"
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-20-13-45/ffmpeg-n8.1.2-44-g7c533d0f86-win64-lgpl-shared-8.1.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($hash -ne "d311c8c7b86e06b54588e442652f963bae165bd4d8393e73cc9ebb445b025547") {
            throw "archive hash mismatch: $hash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $root -Force
          $ffmpeg = Get-ChildItem -LiteralPath $root -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          if ($null -eq $ffmpeg) { throw "ffmpeg.exe missing" }
          & $ffmpeg.FullName -version
          Write-Host "=== H264/AVC encoder lines ==="
          & $ffmpeg.FullName -hide_banner -encoders 2>&1 | Select-String -Pattern "264|AVC" -CaseSensitive:$false
          foreach ($encoder in @("h264_mf","libopenh264","mpeg4")) {
            Write-Host "=== TRY $encoder ==="
            $out = Join-Path $env:RUNNER_TEMP ("probe-" + $encoder + ".mp4")
            $args = @("-hide_banner","-loglevel","error","-y","-f","lavfi","-i","color=c=black:s=320x180:r=30:d=1","-c:v",$encoder,"-pix_fmt","yuv420p","-an",$out)
            & $ffmpeg.FullName @args
            Write-Host "$encoder exit=$LASTEXITCODE exists=$(Test-Path -LiteralPath $out)"
          }