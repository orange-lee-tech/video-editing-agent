name: Asset Ingest Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/media-ingest-probe.yml"
      - ".github/scripts/install-ffmpeg-windows.ps1"
      - "scripts/probe_asset_ingest.py"
      - "src/video_editing_agent/domain/asset/model.py"
      - "src/video_editing_agent/media/ingest/**"

permissions:
  contents: read
  statuses: write

concurrency:
  group: asset-ingest-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-ingest:
    name: Windows Asset Ingest Probe
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked base environment
        run: uv sync --frozen

      - name: Install pinned FFmpeg 8.1
        shell: pwsh
        run: .\.github\scripts\install-ffmpeg-windows.ps1

      - name: Verify ffprobe binary
        run: ffprobe -version | Select-Object -First 1

      - name: Generate audiovisual probe file
        shell: pwsh
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc=size=320x180:rate=25:duration=2" -f lavfi -i "sine=frequency=1000:sample_rate=48000:duration=2" -c:v mpeg4 -q:v 2 -c:a aac -shortest asset-ingest-probe.mp4

      - name: Probe real Asset ingestion
        id: ingest_probe
        continue-on-error: true
        run: uv run python .\scripts\probe_asset_ingest.py .\asset-ingest-probe.mp4 --expected-duration-ms 2000

      - name: Publish Asset ingest status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_OUTCOME: ${{ steps.ingest_probe.outcome }}
        run: |
          if [ "$PROBE_OUTCOME" = "success" ]; then
            state="success"
            description="real ffprobe Asset ingest probe passed on Windows"
          else
            state="failure"
            description="real ffprobe Asset ingest probe failed on Windows"
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="ci/asset-ingest-windows" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Fail workflow when Asset ingest probe failed
        if: steps.ingest_probe.outcome != 'success'
        run: exit 1
