name: Minimum Review Repair Real Media Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/probes/minimum_review_repair.trigger"

permissions:
  contents: read
  statuses: write

concurrency:
  group: minimum-review-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-review:
    name: Windows Minimum Review Repair Probe
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked base environment
        run: uv sync --frozen

      - name: Install pinned FFmpeg 8.1
        shell: pwsh
        run: .\.github\scripts\install-ffmpeg-windows.ps1

      - name: Execute production Review path on real media fixtures
        id: review_probe
        continue-on-error: true
        shell: pwsh
        run: |
          uv run python .\tools\probes\r0_12_minimum_review_repair.py --output .\.private\probes\r0_12_review

      - name: Publish minimum Review repair status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_OUTCOME: ${{ steps.review_probe.outcome }}
        run: |
          if [ "$REVIEW_OUTCOME" = "success" ]; then
            state="success"
            description="minimum Review repair real-media probe passed"
          else
            state="failure"
            description="minimum Review repair real-media probe failed"
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="ci/minimum-review-repair-windows" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Fail workflow when Review probe failed
        if: steps.review_probe.outcome != 'success'
        run: exit 1
