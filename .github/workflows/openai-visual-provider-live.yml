name: OpenAI Visual Provider Live Probe

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Pinned OpenAI model snapshot for the live visual provider contract probe"
        required: true
        default: "gpt-5.4-mini-2026-03-17"
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: openai-visual-live-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-live-provider:
    name: Windows OpenAI Visual Provider Probe
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked base environment
        run: uv sync --frozen

      - name: Install pinned FFmpeg 8.1
        shell: pwsh
        run: .\.github\scripts\install-ffmpeg-windows.ps1

      - name: Generate live probe video
        shell: pwsh
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc2=size=320x180:rate=25:duration=2" -c:v mpeg4 -q:v 2 openai-visual-live-probe.mp4

      - name: Run live OpenAI visual provider probe
        id: live_probe
        continue-on-error: true
        shell: pwsh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          uv run python .\scripts\probe_openai_visual_provider.py .\openai-visual-live-probe.mp4 --database .\.probe-state\openai.sqlite3 --artifact-root .\.probe-artifacts --model "${{ inputs.model }}"

      - name: Publish live provider status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_PROBE_OUTCOME: ${{ steps.live_probe.outcome }}
          MODEL: ${{ inputs.model }}
        run: |
          if [ "$LIVE_PROBE_OUTCOME" = "success" ]; then
            state="success"
            description="OpenAI visual provider contract passed with ${MODEL}"
          else
            state="failure"
            description="OpenAI visual provider live probe failed with ${MODEL}"
          fi

          description="${description:0:140}"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="ci/openai-visual-live" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Fail workflow when live provider probe failed
        if: steps.live_probe.outcome != 'success'
        run: exit 1
