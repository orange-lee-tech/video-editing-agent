name: preview-libmpv-lgpl-candidate

on:
  push:
    paths:
      - ".github/workflows/preview-libmpv-lgpl-candidate.yml"
      - "tools/probes/preview/build_libmpv_lgpl_candidate.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      MPV_TAG: v0.41.0
      VS: 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise'
      CC: clang
      CXX: clang++
      CC_LD: lld-link
      CXX_LD: lld-link
      WINDRES: llvm-rc

    steps:
      - name: Checkout project control repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Meson and NASM
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check meson==1.9.2
          choco install nasm -y --no-progress

      - name: Checkout exact mpv release
        shell: pwsh
        run: |
          $mpv = Join-Path $env:RUNNER_TEMP "mpv-v0.41.0"
          git clone --branch $env:MPV_TAG --depth 1 https://github.com/mpv-player/mpv.git $mpv
          if ($LASTEXITCODE -ne 0) { throw "mpv clone failed: $LASTEXITCODE" }
          $tag = (git -C $mpv describe --tags --exact-match HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $tag -ne $env:MPV_TAG) { throw "mpv tag verification failed: $tag" }
          "MPV_SOURCE=$mpv" >> $env:GITHUB_ENV

      - name: Prepare upstream Windows build prerequisites
        shell: pwsh
        run: |
          Push-Location $env:MPV_SOURCE
          try {
            meson wrap update-db
            if ($LASTEXITCODE -ne 0) { throw "meson wrap update-db failed: $LASTEXITCODE" }
            foreach ($wrap in @("expat", "harfbuzz", "libpng", "zlib")) {
              meson wrap install $wrap
              if ($LASTEXITCODE -ne 0) { throw "meson wrap install $wrap failed: $LASTEXITCODE" }
            }
            ./ci/install-cmake.ps1 -arch x64
            if ($LASTEXITCODE -ne 0) { throw "upstream install-cmake failed: $LASTEXITCODE" }
          } finally {
            Pop-Location
          }

      - name: Build and audit LGPL libmpv candidate
        id: build
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -ne 'C:\Program Files\LLVM\bin' -and
            $_ -ne 'C:\Program Files\CMake\bin' -and
            $_ -ne 'C:\Strawberry\c\bin'
          }) -join ';'
          $env:PATH = "$env:MPV_SOURCE\cmake\bin;" + $env:PATH + ';C:\Program Files\NASM'

          Import-Module "$env:VS\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $env:VS -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64"

          $out = Join-Path $env:RUNNER_TEMP "libmpv-lgpl-candidate"
          ./tools/probes/preview/build_libmpv_lgpl_candidate.ps1 `
            -MpvSource $env:MPV_SOURCE `
            -OutputDirectory $out

      - name: Show build diagnostics on failure
        if: ${{ failure() && steps.build.outcome == 'failure' }}
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "libmpv-lgpl-candidate"
          if (Test-Path "$out\build.stderr.log") {
            Write-Host "=== build.stderr.log tail ==="
            Get-Content "$out\build.stderr.log" -Tail 160
          }
          if (Test-Path "$out\meson-logs\meson-log.txt") {
            Write-Host "=== meson-log.txt tail ==="
            Get-Content "$out\meson-logs\meson-log.txt" -Tail 200
          }

      - name: Upload candidate and audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: libmpv-lgpl-v0.41.0-windows-x64
          path: ${{ runner.temp }}\libmpv-lgpl-candidate
          if-no-files-found: warn
          retention-days: 14
