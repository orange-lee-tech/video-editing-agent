name: Publish 1.0.0 Stable Once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-stable-1.0.0-once.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Promote verified 1.0.0 RC assets to stable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          repo="$GITHUB_REPOSITORY"
          rc_tag="v1.0.0-rc-16b60bb"
          stable_tag="v1.0.0"
          source_sha="16b60bb953a987d9201227805a5b2c9b2968943f"
          dir="$RUNNER_TEMP/stable-assets"
          mkdir -p "$dir"

          if gh release view "$stable_tag" --repo "$repo" >/dev/null 2>&1; then
            echo "Stable release $stable_tag already exists; refusing to overwrite it."
            exit 1
          fi

          gh release download "$rc_tag" --repo "$repo" --dir "$dir"

          printf '%s  %s\n' \
            "2432b2d1794ea65498359eeff0941cd1487ca28c3517cdb53c4cc92c3f2a1c71" "$dir/VideoEditingAgent-Setup-1.0.0.exe" \
            "1ae570a6ae9b511cd2fd1b8040ddf37cc59b793f16a0a02398d8af32f582f467" "$dir/VideoEditingAgent-Update-app-core-1.0.0.zip" \
            "d7ff102344c92f1dc3ce396072cf263562ec51adc72d6ae159717b4fefd89d80" "$dir/VideoEditingAgent-Update-media-runtime-1.0.0.zip" \
            "ac8efa1a0b078facf848ce2b585bf4c06b36d2b7078525bc19b8154957d2ada9" "$dir/VideoEditingAgent-Update-transnet-runtime-1.0.0.zip" \
            "08f099f1ca26dd335b5913ae3d46e30d2eebefa760f923c4cf10787a720b5997" "$dir/update-release-components.json" \
            | sha256sum --check --strict

          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          # 有岐 1.0.0

          First stable public release.

          - Human Gate: approved
          - Exact release source: `16b60bb953a987d9201227805a5b2c9b2968943f`
          - Windows installer lifecycle validation: passed
          - Stable assets are byte-for-byte copies of the verified 1.0.0 release candidate assets.
          EOF

          gh release create "$stable_tag" \
            "$dir/VideoEditingAgent-Setup-1.0.0.exe" \
            "$dir/VideoEditingAgent-Update-app-core-1.0.0.zip" \
            "$dir/VideoEditingAgent-Update-media-runtime-1.0.0.zip" \
            "$dir/VideoEditingAgent-Update-transnet-runtime-1.0.0.zip" \
            "$dir/update-release-components.json" \
            --repo "$repo" \
            --target "$source_sha" \
            --title "有岐 1.0.0" \
            --notes-file "$RUNNER_TEMP/release-notes.md"

          gh release view "$stable_tag" --repo "$repo" --json url,tagName,name,isPrerelease,isDraft,targetCommitish
