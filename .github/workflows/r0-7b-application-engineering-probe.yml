name: R0.7B Application Engineering Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/video_editing_agent/application/**"
      - "src/video_editing_agent/adapters/cli/**"
      - "src/video_editing_agent/storage/project/**"
      - "src/video_editing_agent/storage/repositories/**"
      - "tools/probes/r0_7b_application_engineering_probe.py"
      - "tests/integration/test_r0_7b_preproduction_path.py"

permissions:
  contents: read

jobs:
  deterministic-application:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python tools/probes/r0_7b_application_engineering_probe.py
