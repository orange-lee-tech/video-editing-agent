name: R0.13 Windows RC Probe Once 2

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.repository == 'orange-lee-tech/video-editing-agent' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact repaired R0.13 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run windows-release-candidate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_ref="8eeb8c11c0c74266c834860bf503e4ec27ab99c6"
          echo "Dispatched Windows RC for 8eeb8c11c0c74266c834860bf503e4ec27ab99c6"