name: R0.13 Windows RC Probe Once 3

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.repository == 'orange-lee-tech/video-editing-agent' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact repaired R0.13 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run windows-release-candidate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_ref="f7e4dd984c01ed8015d0f750599a06df60df9a5c"
          echo "Dispatched Windows RC for f7e4dd984c01ed8015d0f750599a06df60df9a5c"