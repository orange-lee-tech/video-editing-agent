name: R0.13 Windows RC Probe Once 4

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.repository == 'orange-lee-tech/video-editing-agent' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact R0.13 branch workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run windows-release-candidate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref work/r013-release-polish \
            -f source_ref="6a6bb6fb84345a3c974168f0b4fa0d013af2fc92"
          echo "Dispatched branch Windows RC for 6a6bb6fb84345a3c974168f0b4fa0d013af2fc92"