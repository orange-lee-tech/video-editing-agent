name: R0.13 Windows RC Probe Once

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.repository == 'orange-lee-tech/video-editing-agent' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact R0.13 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run windows-release-candidate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_ref="7b453ef2a6bc4fb412c1b4d995fe55a83a632a17"
          echo "Dispatched Windows RC for 7b453ef2a6bc4fb412c1b4d995fe55a83a632a17"