name: Release 0.1.1 Once

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.repository == 'orange-lee-tech/video-editing-agent' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact merged source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run windows-release-candidate.yml             --repo "$GITHUB_REPOSITORY"             --ref main             -f source_ref="$GITHUB_SHA"
          echo "Dispatched Windows RC for $GITHUB_SHA"
