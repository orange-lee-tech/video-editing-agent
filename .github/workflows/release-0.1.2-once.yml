name: Release 0.1.2 Once

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.repository == 'orange-lee-tech/video-editing-agent' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact 0.1.2 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run windows-release-candidate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_ref="eadbaa74c686f9fe526cb1d3eab64dde21c94d84"
          echo "Dispatched Windows RC for eadbaa74c686f9fe526cb1d3eab64dde21c94d84"
