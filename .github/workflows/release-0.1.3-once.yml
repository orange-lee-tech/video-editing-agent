name: Release 0.1.3 Once

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.repository == 'orange-lee-tech/video-editing-agent' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact 0.1.3 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run windows-release-candidate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_ref="93d8483bb1d10e4bc5903c33f626fdd9f0d0e7ea"
          echo "Dispatched Windows RC for 93d8483bb1d10e4bc5903c33f626fdd9f0d0e7ea"
