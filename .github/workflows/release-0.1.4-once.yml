name: Release 0.1.4 Once

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.repository == 'orange-lee-tech/video-editing-agent' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact 0.1.4 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run windows-release-candidate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_ref="08667fc1e64003869a3176b6d953bedcd1e4d1b1"
          echo "Dispatched Windows RC for 08667fc1e64003869a3176b6d953bedcd1e4d1b1"
