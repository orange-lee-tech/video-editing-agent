name: Retry Release 0.1.1 Once

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.repository == 'orange-lee-tech/video-editing-agent' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact accepted 0.1.1 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run windows-release-candidate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_ref="71d7b7b46fa819f87aba785cefcc2bcf97ab7a46"
          echo "Dispatched Windows RC for 71d7b7b46fa819f87aba785cefcc2bcf97ab7a46"
