name: Shot Frame Sampling Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/shot-frame-sampling-probe.yml"
      - ".github/scripts/install-ffmpeg-windows.ps1"
      - "scripts/probe_shot_frame_sampling.py"
      - "src/video_editing_agent/domain/shot/model.py"
      - "src/video_editing_agent/media/understanding/frame_extraction.py"
      - "src/video_editing_agent/media/understanding/sampling.py"

permissions:
  contents: read
  statuses: write

concurrency:
  group: shot-frame-sampling-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-sampling:
    name: Windows Shot Frame Sampling Probe
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked base environment
        run: uv sync --frozen

      - name: Install pinned FFmpeg 8.1
        shell: pwsh
        run: .\.github\scripts\install-ffmpeg-windows.ps1

      - name: Generate frame-sampling probe video
        shell: pwsh
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc2=size=320x180:rate=25:duration=2" -c:v mpeg4 -q:v 2 frame-sampling-probe.mp4

      - name: Probe deterministic frame extraction
        id: sampling_probe
        continue-on-error: true
        run: uv run python .\scripts\probe_shot_frame_sampling.py .\frame-sampling-probe.mp4 --duration-ms 2000 --max-frames 3 --expected-width 320 --expected-height 180

      - name: Publish frame-sampling status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_OUTCOME: ${{ steps.sampling_probe.outcome }}
        run: |
          if [ "$PROBE_OUTCOME" = "success" ]; then
            state="success"
            description="real Shot frame sampling probe passed on Windows"
          else
            state="failure"
            description="real Shot frame sampling probe failed on Windows"
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="ci/shot-frame-sampling-windows" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Fail workflow when frame-sampling probe failed
        if: steps.sampling_probe.outcome != 'success'
        run: exit 1
