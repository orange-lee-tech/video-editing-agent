name: SQLite Persistence Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sqlite-persistence-probe.yml"
      - ".github/scripts/install-ffmpeg-windows.ps1"
      - "scripts/probe_sqlite_persistence.py"
      - "src/video_editing_agent/application/ports/asset_media.py"
      - "src/video_editing_agent/application/ports/asset_repository.py"
      - "src/video_editing_agent/application/ports/shot_analysis_repository.py"
      - "src/video_editing_agent/application/ports/shot_repository.py"
      - "src/video_editing_agent/domain/asset/**"
      - "src/video_editing_agent/domain/shot/**"
      - "src/video_editing_agent/media/ingest/**"
      - "src/video_editing_agent/media/shot_detection/catalog.py"
      - "src/video_editing_agent/media/understanding/**"
      - "src/video_editing_agent/storage/artifact/**"
      - "src/video_editing_agent/storage/asset/**"
      - "src/video_editing_agent/storage/repositories/**"

permissions:
  contents: read
  statuses: write

concurrency:
  group: sqlite-persistence-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-persistence:
    name: Windows SQLite Persistence Probe
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked base environment
        run: uv sync --frozen

      - name: Install pinned FFmpeg 8.1
        shell: pwsh
        run: .\.github\scripts\install-ffmpeg-windows.ps1

      - name: Generate persistence probe video
        shell: pwsh
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc2=size=320x180:rate=25:duration=2" -c:v mpeg4 -q:v 2 sqlite-persistence-probe.mp4

      - name: Seed SQLite in first Python process
        id: seed
        continue-on-error: true
        shell: pwsh
        run: |
          uv run python .\scripts\probe_sqlite_persistence.py seed .\sqlite-persistence-probe.mp4 --database .\.probe-state\project.sqlite3 --artifact-root .\.probe-artifacts

      - name: Resume SQLite in second Python process
        id: resume
        if: steps.seed.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          uv run python .\scripts\probe_sqlite_persistence.py resume .\sqlite-persistence-probe.mp4 --database .\.probe-state\project.sqlite3 --artifact-root .\.probe-artifacts

      - name: Publish SQLite persistence status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SEED_OUTCOME: ${{ steps.seed.outcome }}
          RESUME_OUTCOME: ${{ steps.resume.outcome }}
        run: |
          if [ "$SEED_OUTCOME" = "success" ] && [ "$RESUME_OUTCOME" = "success" ]; then
            state="success"
            description="SQLite persistence survived separate Windows Python processes"
          else
            state="failure"
            description="SQLite persistence probe failed: seed=${SEED_OUTCOME}, resume=${RESUME_OUTCOME}"
          fi

          description="${description:0:140}"
          for attempt in 1 2 3; do
            if gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
              -f state="$state" \
              -f context="ci/sqlite-persistence-windows" \
              -f description="$description" \
              -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"; then
              exit 0
            fi
            echo "warning: SQLite status publication attempt ${attempt}/3 failed" >&2
            sleep 2
          done

          echo "warning: SQLite status publication unavailable; preserving probe outcome" >&2
          exit 0

      - name: Fail workflow when persistence probe failed
        if: steps.seed.outcome != 'success' || steps.resume.outcome != 'success'
        run: exit 1
