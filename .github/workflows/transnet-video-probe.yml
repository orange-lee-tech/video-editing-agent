name: TransNetV2 Video Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/transnet-video-probe.yml"
      - "scripts/probe_transnetv2_video.py"
      - "src/video_editing_agent/media/shot_detection/ffmpeg_frames.py"
      - "src/video_editing_agent/media/shot_detection/transnet_backend.py"
      - "src/video_editing_agent/media/shot_detection/transnet_runtime.py"
      - "src/video_editing_agent/media/shot_detection/transnet_scenes.py"
      - "src/video_editing_agent/media/shot_detection/transnet_predictions.py"
      - "src/video_editing_agent/media/shot_detection/transnet_window.py"

permissions:
  contents: read
  statuses: write

concurrency:
  group: transnet-video-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-video:
    name: Windows Real-Video Probe
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked base environment
        run: uv sync --frozen

      - name: Install pinned FFmpeg 8.1
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-8.1-full_build.zip"
          $installRoot = Join-Path $env:RUNNER_TEMP "ffmpeg-8.1"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/8.1/ffmpeg-8.1-full_build.zip"
          $expectedSha256 = "587B1C37DE29C5003D01CF65DA10001BAC43A58B88E61AF0FC77C61DAFF04761"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha256 = (Get-FileHash $archive -Algorithm SHA256).Hash
          if ($actualSha256 -ne $expectedSha256) {
            throw "FFmpeg archive SHA-256 mismatch: expected $expectedSha256, got $actualSha256"
          }

          Expand-Archive -Path $archive -DestinationPath $installRoot -Force
          $ffmpeg = Get-ChildItem -Path $installRoot -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if ($null -eq $ffmpeg) {
            throw "ffmpeg.exe was not found after archive extraction"
          }

          $ffmpeg.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $ffmpeg.FullName -version | Select-Object -First 1

      - name: Verify FFmpeg binary
        run: ffmpeg -version | Select-Object -First 1

      - name: Generate synthetic hard-cut video
        shell: pwsh
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc=size=320x180:rate=25:duration=1" -f lavfi -i "smptebars=size=320x180:rate=25:duration=1" -f lavfi -i "testsrc2=size=320x180:rate=25:duration=1" -f lavfi -i "color=c=blue:size=320x180:rate=25:duration=1" -filter_complex "[0:v][1:v][2:v][3:v]concat=n=4:v=1:a=0,format=yuv420p[v]" -map "[v]" -c:v mpeg4 -q:v 2 synthetic-hard-cuts.mp4

      - name: Probe complete video path
        id: video_probe
        continue-on-error: true
        run: uv run --with "transnetv2-pytorch==1.0.5" python .\scripts\probe_transnetv2_video.py .\synthetic-hard-cuts.mp4 --duration-ms 4000 --require-boundary

      - name: Publish video probe status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_OUTCOME: ${{ steps.video_probe.outcome }}
        run: |
          if [ "$PROBE_OUTCOME" = "success" ]; then
            state="success"
            description="FFmpeg to TransNetV2 real-video probe passed on Windows"
          else
            state="failure"
            description="FFmpeg to TransNetV2 real-video probe failed on Windows"
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="ci/transnetv2-windows-video" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Fail workflow when video probe failed
        if: steps.video_probe.outcome != 'success'
        run: exit 1
