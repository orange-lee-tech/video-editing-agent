name: UnderstandingService Ownership Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/understanding-owner-probe.yml"
      - ".github/scripts/install-ffmpeg-windows.ps1"
      - "scripts/probe_understanding_owner.py"
      - "src/video_editing_agent/application/ports/artifact_store.py"
      - "src/video_editing_agent/application/ports/asset_media.py"
      - "src/video_editing_agent/application/ports/shot_analysis_repository.py"
      - "src/video_editing_agent/application/ports/shot_repository.py"
      - "src/video_editing_agent/application/ports/understanding.py"
      - "src/video_editing_agent/application/ports/visual_understanding.py"
      - "src/video_editing_agent/domain/shot/analysis.py"
      - "src/video_editing_agent/media/understanding/**"
      - "src/video_editing_agent/storage/artifact/**"

permissions:
  contents: read
  statuses: write

concurrency:
  group: understanding-owner-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-understanding:
    name: Windows Understanding Ownership Probe
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked base environment
        run: uv sync --frozen

      - name: Install pinned FFmpeg 8.1
        shell: pwsh
        run: .\.github\scripts\install-ffmpeg-windows.ps1

      - name: Generate understanding probe video
        shell: pwsh
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc2=size=320x180:rate=25:duration=2" -c:v mpeg4 -q:v 2 understanding-probe.mp4

      - name: Probe UnderstandingService ownership
        id: understanding_probe
        continue-on-error: true
        run: uv run python .\scripts\probe_understanding_owner.py .\understanding-probe.mp4 --duration-ms 2000 --artifact-root .\.probe-artifacts

      - name: Publish understanding ownership status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_OUTCOME: ${{ steps.understanding_probe.outcome }}
        run: |
          if [ "$PROBE_OUTCOME" = "success" ]; then
            state="success"
            description="UnderstandingService ownership probe passed on Windows"
          else
            state="failure"
            description="UnderstandingService ownership probe failed on Windows"
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context="ci/understanding-owner-windows" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Fail workflow when ownership probe failed
        if: steps.understanding_probe.outcome != 'success'
        run: exit 1
