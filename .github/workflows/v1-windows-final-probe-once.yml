name: 1.0.0 Windows Final Probe Once

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: ${{ github.repository == 'orange-lee-tech/video-editing-agent' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact 1.0.0 Windows workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run windows-release-candidate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f source_ref="16b60bb953a987d9201227805a5b2c9b2968943f"
          echo "Dispatched Windows 1.0.0 final verification for 16b60bb953a987d9201227805a5b2c9b2968943f"
