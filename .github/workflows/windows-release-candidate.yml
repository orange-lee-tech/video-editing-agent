name: Windows Release Candidate

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source ref to package
        required: true
        default: main
        type: string

concurrency:
  group: windows-release-candidate
  cancel-in-progress: false

jobs:
  setup-exe:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout selected release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Record exact release source
        id: source
        shell: powershell
        run: |
          $sha = (git rev-parse HEAD).Trim()
          if (-not $sha) { throw "Could not resolve release source SHA" }
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $versionText = Get-Content -LiteralPath ".\src\video_editing_agent\version.py" -Raw
          $match = [regex]::Match($versionText, 'APP_VERSION\s*=\s*"(?<version>\d+\.\d+\.\d+)"')
          if (-not $match.Success) { throw "Could not resolve APP_VERSION" }
          $version = $match.Groups["version"].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Release source: $sha"
          Write-Host "Application version: $version"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install exact packaging Python
        shell: powershell
        run: uv python install 3.12.13

      - name: Synchronize pinned packaging environment
        shell: powershell
        run: uv sync --frozen --group packaging --python 3.12.13

      - name: Build inspect and smoke Windows application staging
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\package_windows.ps1

      - name: Materialize release signing credentials
        id: signing
        shell: powershell
        env:
          WINDOWS_CODESIGN_PFX_B64: ${{ secrets.WINDOWS_CODESIGN_PFX_B64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
          UPDATE_MANIFEST_SIGNING_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_B64)) {
            throw "WINDOWS_CODESIGN_PFX_B64 is required for release candidates"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_PASSWORD)) {
            throw "WINDOWS_CODESIGN_PFX_PASSWORD is required for release candidates"
          }
          if ($env:UPDATE_MANIFEST_SIGNING_KEY -notmatch '^[0-9a-fA-F]{64}$') {
            throw "UPDATE_MANIFEST_SIGNING_KEY must be a 32-byte Ed25519 seed encoded as hex"
          }
          $pfx = Join-Path $env:RUNNER_TEMP "video-editing-agent-codesign.pfx"
          try {
            [IO.File]::WriteAllBytes(
              $pfx,
              [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_B64)
            )
          }
          catch {
            throw "WINDOWS_CODESIGN_PFX_B64 is not valid base64"
          }
          "pfx=$pfx" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Authenticode sign staged product executables
        shell: powershell
        env:
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          & .\scripts\sign_windows_artifacts.ps1 `
            -PfxPath "${{ steps.signing.outputs.pfx }}" `
            -PfxPassword $env:WINDOWS_CODESIGN_PFX_PASSWORD `
            -File @(
              ".\build\packaging\dist\VideoEditingAgent\VideoEditingAgent.exe",
              ".\build\packaging\dist\VideoEditingAgent\VideoEditingAgent-cli.exe",
              ".\build\packaging\dist\VideoEditingAgent\VideoEditingAgent-updater.exe"
            ) `
            -EvidencePath ".\build\packaging\evidence\authenticode-staged.json"

      - name: Rebuild component archives and smoke signed staging
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\package_windows.ps1 -SkipBuild

      - name: Acquire and verify Inno Setup 7.1.0
        id: inno
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $release = "7.1.0"
          $asset = "https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe"
          $expected = "0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f"
          $download = Join-Path $env:RUNNER_TEMP "innosetup-7.1.0-x64.exe"
          $root = Join-Path $env:RUNNER_TEMP "inno-7.1.0"

          Invoke-WebRequest -Uri $asset -OutFile $download
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $download).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Inno Setup 7.1.0 SHA-256 mismatch: $actual"
          }

          $signature = Get-AuthenticodeSignature -LiteralPath $download
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Inno Setup Authenticode signature is not valid: $($signature.Status)"
          }
          if ($signature.SignerCertificate.Subject -notmatch "Pyrsys B\.V\.") {
            throw "Unexpected Inno Setup signer: $($signature.SignerCertificate.Subject)"
          }

          $process = Start-Process -FilePath $download -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=$root"
          ) -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup tool installation failed with exit code $($process.ExitCode)"
          }

          $iscc = Join-Path $root "ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "Verified Inno Setup compiler was not installed: $iscc"
          }
          $compilerFileVersion = (Get-Item -LiteralPath $iscc).VersionInfo.FileVersion

          New-Item -ItemType Directory -Force -Path "build/installer" | Out-Null
          [ordered]@{
            schema = "video-editing-agent-installer-tool-evidence/v1"
            tool = "Inno Setup"
            release = $release
            release_version_authority = "verified immutable release asset"
            immutable_release_tag = "is-7_1_0"
            asset = $asset
            sha256 = $actual
            authenticode_status = [string]$signature.Status
            authenticode_signer = $signature.SignerCertificate.Subject
            compiler_path = $iscc
            compiler_file_version_informational = $compilerFileVersion
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 "build/installer/inno-tool-evidence.json"

          "iscc=$iscc" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release=$release" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build guided Setup.exe
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\build_windows_installer.ps1
          -IsccPath "${{ steps.inno.outputs.iscc }}"
          -InstallerToolVersion "${{ steps.inno.outputs.release }}"
          -AppVersion "${{ steps.source.outputs.version }}"

      - name: Authenticode sign guided Setup.exe
        shell: powershell
        env:
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          & .\scripts\sign_windows_artifacts.ps1 `
            -PfxPath "${{ steps.signing.outputs.pfx }}" `
            -PfxPassword $env:WINDOWS_CODESIGN_PFX_PASSWORD `
            -File @(
              ".\build\installer\VideoEditingAgent-Setup-${{ steps.source.outputs.version }}.exe"
            ) `
            -EvidencePath ".\build\installer\authenticode-installer.json"

      - name: Reclaim sealed packaging staging before lifecycle smoke
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = ".\build\installer\VideoEditingAgent-Setup-${{ steps.source.outputs.version }}.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Sealed Setup.exe is missing before lifecycle smoke"
          }
          $before = Get-PSDrive -Name D -ErrorAction SilentlyContinue
          if ($null -ne $before) {
            Write-Host "D: free before cleanup: $($before.Free) bytes"
          }
          foreach ($path in @(
            ".\build\packaging\dist",
            ".\build\packaging\work",
            ".\build\runtime-payloads"
          )) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force
            }
          }
          $after = Get-PSDrive -Name D -ErrorAction SilentlyContinue
          if ($null -ne $after) {
            Write-Host "D: free after cleanup: $($after.Free) bytes"
          }

      - name: Smoke install upgrade repair and uninstall lifecycle
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\scripts\smoke_windows_installer.ps1
          -InstallerPath .\build\installer\VideoEditingAgent-Setup-${{ steps.source.outputs.version }}.exe

      - name: Build and verify signed stable-channel manifest asset
        shell: powershell
        env:
          UPDATE_MANIFEST_SIGNING_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.source.outputs.version }}"
          $publishedAt = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = ".\build\update-components\update-channel-manifest.json"
          uv run python tools/maintenance/build_update_channel_manifest.py `
            --version $version `
            --published-at $publishedAt `
            --installer ".\build\installer\VideoEditingAgent-Setup-$version.exe" `
            --component-metadata ".\build\update-components\update-release-components.json" `
            --component-root ".\build\update-components" `
            --repository-slug "orange-lee-tech/video-editing-agent" `
            --release-notes-url "https://orange-lee-tech.github.io/homepages/video-editing-agent/stable/$version.html" `
            --output $manifest
          if ($LASTEXITCODE -ne 0) { throw "Signed update-channel manifest build failed" }
          uv run python -c "from pathlib import Path; from video_editing_agent.adapters.product.update_check import parse_update_manifest; parse_update_manifest(Path(r'$manifest').read_text(encoding='utf-8')); print('signed update manifest verified')"
          if ($LASTEXITCODE -ne 0) { throw "Signed update-channel manifest verification failed" }

      - name: Upload compact installer failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditingAgent-installer-smoke-failure-${{ steps.source.outputs.sha }}
          path: |
            build/installer/installer-smoke-failure.json
            build/installer/installer-smoke-progress.log
            build/installer/smoke-logs
            build/installer/installer-evidence.json
            build/installer/inno-tool-evidence.json
            build/installer/authenticode-installer.json
            build/packaging/evidence/authenticode-staged.json
          if-no-files-found: warn
          compression-level: 9
          retention-days: 7

      - name: Publish durable prerelease installer and component patches
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ steps.source.outputs.version }}"
          $sha = "${{ steps.source.outputs.sha }}"
          $short = $sha.Substring(0, 7)
          $tag = "v$version-rc-$short"
          $installer = ".\\build\\installer\\VideoEditingAgent-Setup-$version.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Release installer is missing: $installer"
          }

          $ErrorActionPreference = "Continue"
          gh release view $tag --json url 2>$null | Out-Null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = "Stop"

          $componentRoot = ".\\build\\update-components"
          $componentArchives = @(
            Get-ChildItem -LiteralPath $componentRoot -Filter "VideoEditingAgent-Update-*.zip" |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )
          $componentMetadata = Join-Path $componentRoot "update-release-components.json"
          $signedManifest = Join-Path $componentRoot "update-channel-manifest.json"
          if (
            $componentArchives.Count -lt 3 -or
            -not (Test-Path -LiteralPath $componentMetadata -PathType Leaf) -or
            -not (Test-Path -LiteralPath $signedManifest -PathType Leaf)
          ) {
            throw "Component patch or signed update-channel release assets are incomplete"
          }

          if ($releaseExists) {
            $assets = @($installer) + $componentArchives + @($componentMetadata, $signedManifest)
            gh release upload $tag @assets --clobber
          }
          else {
            gh release create $tag $installer `
              --target $sha `
              --title "有岐 $version RC ($short)" `
              --notes "Windows release candidate with Authenticode-signed product binaries, full-installer recovery, signed update manifest, and component patch assets. Source: $sha" `
              --prerelease
            if ($LASTEXITCODE -eq 0) {
              $patchAssets = $componentArchives + @($componentMetadata, $signedManifest)
              gh release upload $tag @patchAssets --clobber
            }
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish prerelease installer/component assets"
          }
          gh release view $tag --json url,tagName,name

      - name: Upload release-candidate installer and compact evidence
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: VideoEditingAgent-Setup-${{ steps.source.outputs.sha }}
          path: |
            build/installer/VideoEditingAgent-Setup-${{ steps.source.outputs.version }}.exe
            build/installer/installer-evidence.json
            build/installer/inno-tool-evidence.json
            build/installer/authenticode-installer.json
            build/installer/installer-smoke.json
            build/packaging/evidence
            build/update-components/update-release-components.json
            build/update-components/update-channel-manifest.json
            build/update-components/VideoEditingAgent-Update-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Remove materialized code-signing certificate
        if: always()
        shell: powershell
        run: |
          $pfx = "${{ steps.signing.outputs.pfx }}"
          if ($pfx -and (Test-Path -LiteralPath $pfx)) {
            Remove-Item -LiteralPath $pfx -Force
          }
