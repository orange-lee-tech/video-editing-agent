name: R0.7B Application Engineering Probe

# R0.7B is closed. Keep this deterministic end-to-end probe available for explicit
# regression investigation without making later Roadmap phases pay a permanent
# phase-specific runner cost on every application/storage change.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-application:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.2"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run python tools/probes/r0_7b_application_engineering_probe.py
